name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run format:check
      - run: npm test
      - name: Run the examples
        run: |
          node dist/src/cli/main.js run examples/fizzbuzz.nc
          node dist/src/cli/main.js run examples/modules/main.nc
          node dist/src/cli/main.js test examples/testing.nc
